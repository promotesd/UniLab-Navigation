# @package _global_

# MuJoCo differential-drive PointGoal navigation task.
#
# PPO algorithm settings intentionally inherit the defaults from:
# conf/ppo/config.yaml
#
# Therefore this task keeps:
#   num_envs: 4096
#   num_steps_per_env: 24
#   max_iterations: 101
#   actor_hidden_dims: [512, 256, 128]
#   critic_hidden_dims: [512, 256, 128]

training:
  task_name: DiffDrivePointGoal
  sim_backend: mujoco

  play_steps: 500
  play_env_num: 16
  render_spacing: 0.0

  cam_tracking: true
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 9

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  camera_focus_body_name: base_link
  use_env_visual_model: false

algo:
  obs_groups:
    actor:
      - actor
    critic:
      - critic

reward:
  progress_scale: 2.0
  success_bonus: 10.0
  time_penalty: 0.01
